<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ValConvex match</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1f2328;--muted:#6b7280;--border:#e2e2dd;--soft:#f0f0ec;--green:#1d9e75;--red:#d64545;--amber:#d98a0b}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1c1f25;--text:#e6e8eb;--muted:#8a919c;--border:#2c313a;--soft:#242830;--green:#3ecf8e;--red:#ff6b6b;--amber:#f5a524}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px}
h1{margin:0;font-size:24px}.win{color:var(--green)}.loss{color:var(--red)}
.muted{color:var(--muted)}.small{font-size:12px}
table{width:100%;border-collapse:collapse}
th{font-weight:400;color:var(--muted);font-size:12px;text-align:right;padding:4px 6px}
td{padding:6px;border-top:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
.tag{display:inline-block;padding:0 6px;border-radius:6px;font-size:11px;margin-left:6px;background:var(--soft);border:1px solid var(--border)}
.mvp{background:rgba(217,138,11,.15);color:var(--amber);border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
select,button{font:inherit;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)}
button.on{background:var(--text);color:var(--card);border-color:var(--text)}
canvas{width:100%;max-width:640px;display:block;margin:0 auto;border-radius:10px;border:1px solid var(--border);background:#1e2228;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0;font-size:12px;color:var(--muted)}
.legend2{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0;font-size:12px}.legend2 span{cursor:pointer}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.kv span:first-child{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="head"></div>
  <div class="card"><div id="boards"></div></div>
  <div class="card">
    <div class="row">
      <select id="fWho" aria-label="Player"></select>
      <select id="fRound" aria-label="Round"></select>
    </div>
    <div class="row" id="fType"></div>
    <div class="row" id="fSide"></div>
    <div class="row">
      <select id="fCat" aria-label="Weapon type"></select>
      <select id="fWpn" aria-label="Weapon"></select>
      <label class="small muted" style="align-self:center"><input type="checkbox" id="fPlants" checked> Spike plants</label>
    </div>
    <div class="row"><select id="fColor" aria-label="Color markers by"><option value="player">Color by player</option><option value="result">Color by result</option></select></div>
    <div id="legend" class="legend2"></div>
    <canvas id="cv" width="800" height="800"></canvas>
    <div class="legend"><span style="color:var(--green)">&#9679; Kill (killer position)</span><span style="color:var(--red)">&#9670; Death</span><span style="color:var(--amber)">&#9650; Spike plant</span><span id="cnt" style="margin-left:auto"></span></div>
    <div id="detail" class="small"></div>
  </div>
  <p class="small muted">Made with ValConvex. Kills mark where the killer was standing when the kill happened, deaths where the player died, and the dashed line links to the other player.</p>
</div>

<script id="core">
var TIERS=["Unranked","","","Iron 1","Iron 2","Iron 3","Bronze 1","Bronze 2","Bronze 3","Silver 1","Silver 2","Silver 3","Gold 1","Gold 2","Gold 3","Platinum 1","Platinum 2","Platinum 3","Diamond 1","Diamond 2","Diamond 3","Ascendant 1","Ascendant 2","Ascendant 3","Immortal 1","Immortal 2","Immortal 3","Radiant"];
var CAT_ORDER=["Rifles","SMGs","Shotguns","Heavy","Snipers","Sidearms","Abilities","Melee","Other"];
function tierName(t){return TIERS[t||0]||"Unranked";}
function isVisible(r,f){
  if(f.who==="me"){if(r.team!=="me")return false;}
  else if(f.who==="en"){if(r.team!=="en")return false;}
  else if(f.who!=="all"&&r.who!==f.who)return false;
  if(f.side!=="all"&&r.s!==f.side)return false;
  if(f.rnd&&r.r!==f.rnd)return false;
  if(r.t==="p")return !!f.plants;
  if(f.type!=="both"&&r.t!==f.type)return false;
  if(f.cat!=="all"&&r.cat!==f.cat)return false;
  if(f.wpn!=="any"&&r.w!==f.wpn)return false;
  return true;
}
function filterRecords(recs,f){return recs.filter(function(r){return isVisible(r,f);});}
function countRecords(recs){var c={kills:0,deaths:0,plants:0};recs.forEach(function(r){if(r.t==="k")c.kills++;else if(r.t==="d")c.deaths++;else c.plants++;});return c;}
function categoriesPresent(recs){var have={};recs.forEach(function(r){if(r.t!=="p"&&r.cat)have[r.cat]=1;});var out=CAT_ORDER.filter(function(c){return have[c];});Object.keys(have).sort().forEach(function(c){if(out.indexOf(c)<0)out.push(c);});return out;}
function weaponsIn(recs,cat){var have={};recs.forEach(function(r){if(r.t!=="p"&&r.w&&(cat==="all"||r.cat===cat))have[r.w]=1;});return Object.keys(have).sort();}
var PALETTE=["#4cc9f0","#f72585","#b5e48c","#ffb703","#9d4edd","#ef476f","#06d6a0","#ff9f1c","#4895ef","#e5989b"];
function playerColors(players){var ids=players.map(function(p){return p.puuid;}).sort();var m={};ids.forEach(function(u,i){m[u]=PALETTE[i%PALETTE.length];});return m;}
function rgba(h,a){var n=parseInt(h.slice(1),16);return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function playerName(p){if(!p)return "Unknown";if(p.name)return p.tag?p.name+"#"+p.tag:p.name;return (p.agent||"Player")+" (hidden)";}
function fmtTime(ms){ms=ms||0;var s=Math.floor(ms/1000);return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2);}
</script>

<script id="ui">
var DATA=/*__VT_DATA__*/null;
(function(){
  var head=document.getElementById("head");
  if(!DATA){head.innerHTML="<b>No match data embedded.</b> This is the blank template.";return;}
  var M=DATA.match,REC=DATA.records,PL={};
  M.players.forEach(function(p){PL[p.puuid]=p;});
  var W=800,cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  var img=null,loaded=false;
  if(DATA.minimap){img=new Image();img.onload=function(){loaded=true;draw();};img.src=DATA.minimap;}

  // ---- header + leaderboard
  var won=M.result.won,draw_=M.result.draw;
  head.innerHTML='<h1 class="'+(draw_?"":won?"win":"loss")+'">'+(draw_?"Draw":won?"Victory":"Defeat")+'</h1>'+
    '<div class="muted">'+esc(M.map.name)+' &middot; '+esc(M.queue||"custom")+' &middot; '+M.result.score[0]+'&ndash;'+M.result.score[1]+
    ' &middot; '+new Date(M.started_ms).toLocaleString()+'</div>'+
    (M.pre_win_prob!=null?'<div class="small muted">Pre-match estimate: '+Math.round(M.pre_win_prob*100)+'%</div>':"");
  function board(team,title,cls){
    var rows=M.players.filter(function(p){return p.team===team;}).map(function(p){
      var tags=(p.party?'<span class="tag">'+esc(p.party)+'&middot;'+p.party_size+'</span>':"")+
        (M.mvp.match===p.puuid?'<span class="tag mvp">Match MVP</span>':"")+(M.mvp.team===p.puuid?'<span class="tag mvp">Team MVP</span>':"");
      return '<tr><td><b>'+esc(playerName(p))+'</b>'+tags+'<div class="small muted">'+esc(p.agent)+' &middot; '+esc(tierName(p.tier))+'</div></td>'+
        '<td>'+p.kills+'/'+p.deaths+'/'+p.assists+'</td><td>'+Math.round(p.acs)+'</td><td>'+Math.round(p.adr)+'</td><td>'+Math.round(p.hs*100)+'%</td><td>'+(p.rating==null?"-":p.rating.toFixed(2))+'</td></tr>';
    }).join("");
    return '<div class="'+cls+'" style="font-weight:600;margin:6px 0">'+title+'</div><table><tr><th>Player</th><th>K/D/A</th><th>ACS</th><th>ADR</th><th>HS%</th><th>Rating</th></tr>'+rows+'</table>';
  }
  document.getElementById("boards").innerHTML=board("me","Your team","win")+board("en","Enemy team","loss");

  // ---- filters
  var st={who:"all",type:"both",side:"all",rnd:0,cat:"all",wpn:"any",plants:true,sel:null,color:"player"};
  var whoSel=document.getElementById("fWho"),rndSel=document.getElementById("fRound"),catSel=document.getElementById("fCat"),wpnSel=document.getElementById("fWpn");
  function opt(v,l){return '<option value="'+esc(v)+'">'+esc(l)+'</option>';}
  whoSel.innerHTML=opt("all","Everyone")+opt("me","Your team (all five)")+opt("en","Enemy team (all five)")+
    M.players.map(function(p){return opt(p.puuid,playerName(p)+" · "+p.agent+" · "+p.kills+"K "+p.deaths+"D");}).join("");
  var ro=opt("0","All rounds");for(var i=1;i<=M.rounds.length;i++)ro+=opt(String(i),"Round "+i);rndSel.innerHTML=ro;
  catSel.innerHTML=opt("all","All weapon types")+categoriesPresent(REC).map(function(c){return opt(c,c);}).join("");
  function fillWpn(){wpnSel.innerHTML=opt("any","Any weapon")+weaponsIn(REC,st.cat).map(function(w){return opt(w,w);}).join("");st.wpn="any";}
  fillWpn();
  function seg(id,key,items){
    var box=document.getElementById(id);
    box.innerHTML=items.map(function(it){return '<button data-v="'+it[0]+'"'+(st[key]===it[0]?' class="on"':"")+'>'+it[1]+'</button>';}).join("");
    box.addEventListener("click",function(e){var b=e.target.closest?e.target.closest("button"):null;if(!b)return;st[key]=b.getAttribute("data-v");
      Array.prototype.forEach.call(box.querySelectorAll("button"),function(x){x.className=x===b?"on":"";});st.sel=null;draw();});
  }
  seg("fType","type",[["both","Both"],["k","Kills"],["d","Deaths"]]);
  seg("fSide","side",[["all","All sides"],["A","Attack"],["D","Defense"]]);
  var colSel=document.getElementById("fColor");
  function whoChanged(){st.who=whoSel.value;st.color=(st.who==="all"||st.who==="me"||st.who==="en")?"player":"result";colSel.value=st.color;st.sel=null;draw();}
  whoSel.addEventListener("change",whoChanged);
  colSel.addEventListener("change",function(){st.color=colSel.value;st.sel=null;draw();});
  rndSel.addEventListener("change",function(){st.rnd=parseInt(rndSel.value,10)||0;st.sel=null;draw();});
  catSel.addEventListener("change",function(){st.cat=catSel.value;fillWpn();st.sel=null;draw();});
  wpnSel.addEventListener("change",function(){st.wpn=wpnSel.value;st.sel=null;draw();});
  document.getElementById("fPlants").addEventListener("change",function(e){st.plants=!!e.target.checked;st.sel=null;draw();});

  // ---- legend with every player's name
  var COL=playerColors(M.players),legend=document.getElementById("legend");
  legend.innerHTML=M.players.map(function(p){return '<span data-u="'+esc(p.puuid)+'"><i class="sw" style="background:'+COL[p.puuid]+'"></i>'+esc(playerName(p))+" · "+esc(p.agent)+(p.party?" · "+esc(p.party)+"·"+p.party_size:"")+"</span>";}).join("");
  legend.addEventListener("click",function(e){var s=e.target.closest?e.target.closest("span"):null;if(!s)return;whoSel.value=s.getAttribute("data-u");whoChanged();});
  function colorOf(r){if(r.t!=="p"&&st.color==="player")return COL[r.who]||"#aaaaaa";return r.t==="k"?"#2fbf8f":r.t==="d"?"#ef5350":"#f5a524";}
  // ---- drawing
  var vis=[];
  function draw(){
    vis=filterRecords(REC,st);
    ctx.clearRect(0,0,W,W);
    if(loaded){ctx.drawImage(img,0,0,W,W);}
    else{ctx.fillStyle="#1e2228";ctx.fillRect(0,0,W,W);ctx.strokeStyle="rgba(255,255,255,.07)";for(var g=0;g<=W;g+=100){ctx.beginPath();ctx.moveTo(g,0);ctx.lineTo(g,W);ctx.moveTo(0,g);ctx.lineTo(W,g);ctx.stroke();}}
    var dense=vis.length>90,gr=dense?18:26,R=dense?5:8;
    vis.forEach(function(r){if(r.t==="p")return;ctx.fillStyle=rgba(colorOf(r),dense?0.09:0.14);ctx.beginPath();ctx.arc(r.x*W,r.y*W,gr,0,6.2832);ctx.fill();});
    var sel=null;vis.forEach(function(r){if(r.id===st.sel)sel=r;});
    if(sel&&sel.t!=="p"&&sel.ox!=null){ctx.strokeStyle="#fff";ctx.setLineDash([6,6]);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(sel.x*W,sel.y*W);ctx.lineTo(sel.ox*W,sel.oy*W);ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(sel.ox*W,sel.oy*W,7,0,6.2832);ctx.stroke();}
    vis.forEach(function(r){
      var x=r.x*W,y=r.y*W;ctx.lineWidth=1.5;ctx.strokeStyle="rgba(0,0,0,.6)";
      if(r.t==="k"){ctx.fillStyle=colorOf(r);ctx.beginPath();ctx.arc(x,y,R,0,6.2832);ctx.fill();ctx.stroke();}
      else if(r.t==="d"){ctx.fillStyle=colorOf(r);ctx.beginPath();ctx.moveTo(x,y-R-2);ctx.lineTo(x+R+2,y);ctx.lineTo(x,y+R+2);ctx.lineTo(x-R-2,y);ctx.closePath();ctx.fill();ctx.stroke();}
      else{ctx.fillStyle="#f5a524";ctx.beginPath();ctx.moveTo(x,y-R-3);ctx.lineTo(x+R+3,y+R);ctx.lineTo(x-R-3,y+R);ctx.closePath();ctx.fill();ctx.stroke();}
    });
    if(sel){ctx.strokeStyle="#fff";ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(sel.x*W,sel.y*W,R+9,0,6.2832);ctx.stroke();}
    var c=countRecords(vis);
    document.getElementById("cnt").textContent=c.kills+" kills · "+c.deaths+" deaths · "+c.plants+" plants";
    showDetail(sel);
  }
  function showDetail(r){
    var box=document.getElementById("detail");
    if(!r){box.innerHTML='<span class="muted">Tap a marker for the round, location, weapon and who was involved.</span>';return;}
    var side=r.s==="A"?"Attack":r.s==="D"?"Defense":"Side unknown";
    var who=PL[r.who],other=r.other?PL[r.other]:null,rows=[];
    if(r.t==="p"){rows=[["Site",r.c||"Site"],["Planted by",playerName(who)+" · "+(who?who.agent:"")],["Round time",fmtTime(r.rt)]];}
    else{var k=r.t==="k";rows=[["Player",playerName(who)+" · "+(who?who.agent:"")],[k?"Killed":"Killed by",playerName(other)+" · "+(other?other.agent:"")],
      [r.cat==="Abilities"?"Ability":"Weapon",r.w||"Unknown"],[k?"Killer at · victim at":"Died at · killer at",(r.c||"?")+" · "+(r.oc||"?")],["Round time",fmtTime(r.rt)]];}
    box.innerHTML='<div class="kv"><b>'+(r.t==="p"?"Spike plant":r.t==="k"?"Kill":"Death")+'</b><span>Round '+r.r+' · '+side+'</span></div>'+
      rows.map(function(x){return '<div class="kv"><span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></div>';}).join("");
  }
  cv.addEventListener("click",function(e){
    var rect=cv.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width,y=(e.clientY-rect.top)*W/rect.height,best=null,bd=22*22;
    vis.forEach(function(r){var dx=r.x*W-x,dy=r.y*W-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=r;}});
    st.sel=best?best.id:null;draw();
  });
  draw();
})();
</script>
</body>
</html>
